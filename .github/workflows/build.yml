name: Nxygram Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Nyxgram Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eux
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Write Telegram API credentials
        run: |
          mkdir -p TMessagesProj/src/main/res/values
          cat > TMessagesProj/src/main/res/values/api_keys.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <integer name="telegram_api_id">${{ secrets.TELEGRAM_API_ID }}</integer>
              <string name="telegram_api_hash">${{ secrets.TELEGRAM_API_HASH }}</string>
          </resources>
          EOF

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Nyxgram Debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nyxgram-debug-${{ github.sha }}
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            TMessagesProj_App/build/reports/
            TMessagesProj_App/build/outputs/logs/
            ~/.gradle/daemon/*/daemon-*.out.log
          retention-days: 7
