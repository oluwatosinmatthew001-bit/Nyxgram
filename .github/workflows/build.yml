name: Nxygram Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            cmdline-tools;latest

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eux
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager not found at $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            ls -R "$ANDROID_HOME" || true
            exit 1
          fi

          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;21.4.7075529"

      - name: Write Telegram API credentials
        run: |
          mkdir -p TMessagesProj/src/main/res/values
          cat > TMessagesProj/src/main/res/values/api_keys.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <integer name="telegram_api_id">${{ secrets.TELEGRAM_API_ID }}</integer>
              <string name="telegram_api_hash">${{ secrets.TELEGRAM_API_HASH }}</string>
          </resources>
          EOF

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nxygram-debug-${{ github.sha }}
          path: TMessagesProj/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            TMessagesProj/build/reports/
            ~/.gradle/daemon/*/daemon-*.out.log
          retention-days: 7
